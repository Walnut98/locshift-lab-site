<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e8">
  <meta name="description" content="选择坐标并复制到 iPhone 或 Android 的定位测试工具。">
  <title>LocShift · 定位选点</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2317211d'/%3E%3Ccircle cx='32' cy='27' r='12' fill='none' stroke='%23e26b42' stroke-width='5'/%3E%3Cpath d='M32 45l-8 13h16z' fill='%23e26b42'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="LocShift 首页">
        <span class="pin" aria-hidden="true"></span>
        <span><strong>LOC<span>/</span>SHIFT</strong><small>定位选点</small></span>
      </a>
      <div class="platform-switch" role="group" aria-label="选择手机系统">
        <button type="button" data-platform="ios" class="active">iPhone</button>
        <button type="button" data-platform="android">Android</button>
      </div>
    </header>

    <main class="layout">
      <section class="map-wrap" aria-label="地图">
        <div id="map"></div>
        <div class="map-layers" role="group" aria-label="地图图层">
          <button type="button" data-layer="standard" class="active">标准</button>
          <button type="button" data-layer="satellite">卫星</button>
          <button type="button" data-layer="amap">高德</button>
        </div>
        <div class="map-coordinate"><span>目标坐标</span><b id="map-coordinate">31.230416, 121.473701</b></div>
        <button type="button" class="map-locate" id="recenter" aria-label="居中到目标点">◎</button>
      </section>

      <aside class="panel">
        <div class="mode-card">
          <span class="mode-dot" aria-hidden="true"></span>
          <div><strong id="mode-title">iPhone 网络定位</strong><span id="mode-detail">使用小火箭模块，无需每次重新配置证书。</span></div>
        </div>

        <section class="block">
          <div class="heading">
            <div><span class="eyebrow">01 · 选择位置</span><h1>地图点选或粘贴坐标</h1></div>
          </div>
          <div class="search">
            <input id="search-input" type="search" autocomplete="off" placeholder="搜索地点，或粘贴“纬度, 经度”">
            <button type="button" id="search-clear" aria-label="清空" hidden>×</button>
            <div class="search-results" id="search-results" hidden></div>
          </div>
          <div class="coordinates">
            <label><span>纬度 <i>LAT</i></span><input id="latitude" inputmode="decimal" autocomplete="off" value="31.230416"></label>
            <label><span>经度 <i>LON</i></span><input id="longitude" inputmode="decimal" autocomplete="off" value="121.473701"></label>
          </div>
          <p class="inline-error" id="validation" role="alert"></p>
        </section>

        <section class="block action-block">
          <button class="primary" id="copy-coordinate" type="button"><span>复制坐标</span><b id="copy-value">31.230416, 121.473701</b></button>
          <a class="secondary ios-only" id="module-link" href="modules/locshift.sgmodule?v=8">下载小火箭模块</a>
          <a class="secondary ios-only" href="ios.html">检测模块并写入 iPhone</a>
        </section>

        <section class="block instructions" id="instructions">
          <span class="eyebrow">02 · 写入手机</span>
          <ol id="instruction-list"></ol>
          <a class="guide-link" href="guide.html">查看两平台完整教程 <span>→</span></a>
        </section>
      </aside>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="vendor/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
