<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>安卓模拟定位检查</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f9; color: #172033; }
    main { width: min(92vw, 560px); padding: 24px; border-radius: 18px; background: #fff; box-shadow: 0 12px 40px #25304a1a; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { line-height: 1.65; color: #566079; }
    button { width: 100%; border: 0; border-radius: 12px; padding: 15px; font-size: 17px; font-weight: 700; color: #fff; background: #5546a8; }
    button:disabled { opacity: .6; }
    pre { min-height: 150px; margin: 18px 0 0; padding: 16px; overflow-wrap: anywhere; white-space: pre-wrap; border-radius: 12px; background: #161b26; color: #eef1f7; font: 14px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .tip { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #eef3ff; font-size: 14px; color: #34405a; }
    @media (prefers-color-scheme: dark) {
      body { background: #10141c; color: #f1f3f7; }
      main { background: #1a202b; }
      p { color: #b1bacb; }
      .tip { background: #252e3e; color: #d8deea; }
    }
  </style>
</head>
<body>
  <main>
    <h1>安卓模拟定位检查</h1>
    <p>先在 Fake Traveler 中启动模拟位置，再点击下面按钮，并允许本网页使用位置信息。</p>
    <button id="check" type="button">检查当前位置</button>
    <pre id="result">尚未检查</pre>
    <div class="tip" id="tip">判断方法：这里显示的经纬度如果与 Fake Traveler 顶部经纬度相同，说明华为系统正常提供了模拟位置；如果不同，则是系统没有把模拟位置传给其他应用。</div>
  </main>
  <script>
    const button = document.querySelector('#check');
    const result = document.querySelector('#result');
    const tip = document.querySelector('#tip');

    button.addEventListener('click', () => {
      button.disabled = true;
      result.textContent = '正在获取位置…';
      tip.textContent = '请允许本网页使用位置信息。';

      if (!navigator.geolocation) {
        result.textContent = '此浏览器不支持定位接口。';
        button.disabled = false;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          const c = position.coords;
          result.textContent = [
            `纬度：${c.latitude.toFixed(6)}`,
            `经度：${c.longitude.toFixed(6)}`,
            `精度：${Number.isFinite(c.accuracy) ? c.accuracy.toFixed(1) + ' 米' : '未知'}`,
            `时间：${new Date(position.timestamp).toLocaleString('zh-CN')}`,
            `浏览器：${navigator.userAgent}`
          ].join('\n');
          tip.textContent = '把这里的两行经纬度与 Fake Traveler 顶部数值对比。相同或非常接近，说明模拟定位已传到其他应用。';
          button.disabled = false;
        },
        error => {
          const messages = {
            1: '定位权限被拒绝。',
            2: '系统无法获取位置。',
            3: '定位请求超时。'
          };
          result.textContent = `${messages[error.code] || '定位失败。'}\n错误代码：${error.code}\n${error.message || ''}`;
          tip.textContent = '如果错误代码是 1，请检查浏览器和系统定位权限；如果是 2 或 3，检查系统定位总开关、网络和 Fake Traveler 是否仍在运行。';
          button.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  </script>
</body>
</html>
